name: BalancedTeam
version: '${project.version}'
main: com.balancedteam.BalancedTeamPlugin
api-version: '1.20'
author: haha
description: High-performance Clan/Team plugin for Anarchy servers with MySQL, GUI and balanced combat.

softdepend: ["PlaceholderAPI"]

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:8.3.0
  - org.xerial:sqlite-jdbc:3.45.1.0

commands:
  team:
    description: Main command for the team system
    aliases: [t, clan, bt]
    usage: /team help
  teamadmin:
    description: Admin command for the team system
    aliases: [ta, btadmin]
    permission: balancedteam.admin
    usage: /teamadmin help
  teammsg:
    description: Send a team chat message or toggle team chat lock mode
    aliases: [tc, tm, teamchat]
    usage: /teammsg [message]
  teamlang:
    description: Switch or view language settings
    aliases: [tlang, btlang, clanlang]
    usage: /teamlang [list|auto|<language code>]

permissions:
  balancedteam.use:
    description: Allows use of basic team commands
    default: true
  balancedteam.admin:
    description: Allows use of team admin commands
    default: op
  balancedteam.admin.spy:
    description: Allows spying on all team chats
    default: op
  balancedteam.chat.color:
    description: Allows using color codes in team chat
    default: op
    