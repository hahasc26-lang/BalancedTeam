    - "&e/team accept <team> &7- Accept a team invitation"
    - "&e/team reject <team> &7- Reject a team invitation"
    - "&e/team leave &7- Leave current team"
    - "&e/team kick <player> &7- Kick a member from team"
    - "&e/team promote <player> &7- Promote member to officer (Leader only)"
    - "&e/team demote <player> &7- Demote officer to member (Leader only)"
    - "&e/team transfer <player> &7- Transfer team leadership (Leader only)"
    - "&e/team chat [msg] &7- Send team chat or toggle chat mode"
    - "&e/team ff [on/off] &7- View or toggle friendly fire"
    - "&e/team ally add/accept/remove <team> &7- Manage alliances (Mutual consent)"
    - "&e/team enemy add/remove <team> &7- Manage enemy relations"
